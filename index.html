<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFB6C1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Jelly Blocks! 🐻✨ Cute Kids Tetris</title>

  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=3.0.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐻</text></svg>">
</head>
<body class="theme-candy">
  <!-- Particle FX Canvas overlay -->
  <canvas id="fxCanvas"></canvas>

  <div class="app-layout">
    <!-- Top Header: Simple & Large for Kids -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo-emoji">🐻</span>
        <h1 class="logo-title">Jelly Tetris!</h1>
      </div>

      <!-- Score & Stars Badges (Score only increases on line clear!) -->
      <div class="header-score-group">
        <div class="badge-pill score-pill" title="Score (Earned by clearing lines!)">
          <span class="badge-icon">🏆</span>
          <span id="scoreVal" class="badge-val">0</span>
        </div>
        <div class="badge-pill stars-pill" title="Stars Collected">
          <span class="badge-icon">⭐</span>
          <span id="starsVal" class="badge-val">0</span>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="header-tools">
        <button id="themeBtn" class="tool-circle-btn" title="Change Theme" aria-label="Theme">🎨</button>
        <button id="soundBtn" class="tool-circle-btn" title="Sound Mute/Unmute" aria-label="Sound">
          <span id="soundIcon">🔊</span>
        </button>
        <button id="pauseBtn" class="tool-circle-btn" title="Pause Game" aria-label="Pause">⏸️</button>
        <button id="restartBtn" class="tool-circle-btn" title="Restart Game" aria-label="Restart">🔄</button>
      </div>
    </header>

    <!-- Main Game Area (Center Board Maximized on PC!) -->
    <main class="game-arena">
      <!-- Left Side Widget: Pocket (Hold) & Magic Wand -->
      <aside class="side-widget side-left">
        <div class="mini-card" id="btnHoldCard" title="Pocket: Tap to save or swap block!">
          <div class="mini-card-title">🎒 POCKET</div>
          <canvas id="holdCanvas" width="58" height="58"></canvas>
        </div>

        <button id="magicWandBtn" class="big-power-btn" title="Magic Star Wand: Blasts away bottom blocks!">
          <span class="big-power-icon">🪄</span>
          <span class="big-power-label">Magic</span>
        </button>
      </aside>

      <!-- Center: Giant Clear Tetris Board -->
      <section class="board-container">
        <div class="board-frame">
          <canvas id="gameCanvas" width="280" height="560"></canvas>
        </div>

        <!-- Pop-in Celebration Banner (Starts strictly HIDDEN) -->
        <div id="celebrationBanner" class="celebration-banner hidden">
          <div class="banner-inner">
            <span id="praiseText">AWESOME! 🌟</span>
          </div>
        </div>
      </section>

      <!-- Right Side Widget: Next Piece & Mascot Bubu -->
      <aside class="side-widget side-right">
        <div class="mini-card" title="Next piece coming up!">
          <div class="mini-card-title">🔮 NEXT</div>
          <canvas id="nextCanvas" width="58" height="58"></canvas>
        </div>

        <!-- Cheering Mascot -->
        <div class="mascot-display" id="mascotContainer"></div>
      </aside>
    </main>

    <!-- PC Keyboard Hint Pill (Shown nicely on desktop) -->
    <div class="pc-hint-bar">
      <span>⌨️ PC Controls: ◀ ▶ Move | 🔼 Spin | 🔽 Down | Space Slam</span>
    </div>

    <!-- Big Chunky Kid-Friendly Touch Controller (iPhone & iPad) -->
    <footer class="kid-controller">
      <!-- Left Hand: Move Left & Move Right -->
      <div class="ctrl-left-group">
        <button id="btnLeft" class="kid-btn btn-move-left" aria-label="Move Left">
          <span class="kid-btn-icon">◀</span>
          <span class="kid-btn-text">LEFT</span>
        </button>
        <button id="btnRight" class="kid-btn btn-move-right" aria-label="Move Right">
          <span class="kid-btn-icon">▶</span>
          <span class="kid-btn-text">RIGHT</span>
        </button>
      </div>

      <!-- Center: Quick Slam Drop -->
      <div class="ctrl-center-group">
        <button id="btnDrop" class="kid-btn btn-slam-drop" aria-label="Slam Drop">
          <span class="kid-btn-icon">⚡</span>
          <span class="kid-btn-text">DROP</span>
        </button>
      </div>

      <!-- Right Hand: SPIN (Rotate) & DOWN (Soft Drop) -->
      <div class="ctrl-right-group">
        <button id="btnRotate" class="kid-btn btn-spin" aria-label="Spin / Rotate Block">
          <span class="kid-btn-icon">🔄</span>
          <span class="kid-btn-text">SPIN</span>
        </button>
        <button id="btnDown" class="kid-btn btn-drop-down" aria-label="Down / Soft Drop">
          <span class="kid-btn-icon">▼</span>
          <span class="kid-btn-text">DOWN</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Start Game Overlay for Kids -->
  <div id="startOverlay" class="modal-overlay">
    <div class="modal-card start-modal-card">
      <div class="modal-icon">🐻✨</div>
      <h2 class="modal-title">Jelly Tetris!</h2>
      <p class="modal-subtitle">Choose how you want to play:</p>

      <div class="mode-selector">
        <button class="mode-chip active" data-mode="kids">Kids 🌟</button>
        <button class="mode-chip" data-mode="zen">Zen 🎈</button>
        <button class="mode-chip" data-mode="classic">Classic 🏆</button>
      </div>

      <button id="playStartBtn" class="big-play-btn">
        <span>▶️ TAP TO PLAY! 🎈</span>
      </button>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">💤</div>
      <h2 class="modal-title">Game Paused!</h2>
      <p class="modal-subtitle">Take a gentle break or stretch your paws! 🐾</p>
      <button id="resumeBtn" class="big-play-btn">
        <span>▶️ Continue Playing!</span>
      </button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameOverModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">🎉</div>
      <h2 class="modal-title">Super Effort!</h2>
      <p class="modal-subtitle">You did awesome! ⭐ Stars: <strong id="finalStars">0</strong> | 🏆 Score: <strong id="finalScore">0</strong></p>
      <button id="restartModalBtn" class="big-play-btn">
        <span>🌟 Play Again! 🎈</span>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js?v=3.0.0"></script>
  <script src="particles.js?v=3.0.0"></script>
  <script src="mascot.js?v=3.0.0"></script>
  <script src="tetris.js?v=3.0.0"></script>
  <script src="game.js?v=3.0.0"></script>
</body>
</html>
